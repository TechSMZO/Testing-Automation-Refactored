name: UI Smoke Tests (Pilot)

on:
  workflow_dispatch:

jobs:
  ui-smoke:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://panel.shipmozo.com
      HEADLESS: "true"
      BROWSER: "chrome"

    steps:
      # 1️⃣ HARD reset workspace and ensure correct commit
      - name: Checkout repository (clean)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Print commit SHA
        run: |
          echo "Running commit:"
          git rev-parse HEAD

      # 2️⃣ Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3️⃣ Install Chrome explicitly (important)
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # 4️⃣ KILL all Maven cache (this fixes your issue)
      - name: Clear Maven cache
        run: |
          rm -rf ~/.m2/repository

      # 5️⃣ Verify project structure (debug aid)
      - name: Verify source files
        run: |
          echo "Listing test files:"
          find src/test/java -name "*.java"

      # 6️⃣ Force full recompilation and execution
      - name: Run UI smoke tests
        run: |
          mvn -U clean test -X

      # 7️⃣ Upload reports even on failure
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: |
            target/**
            test-output/**
            reports/**
            **/*.html
